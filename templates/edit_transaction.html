<!DOCTYPE html>
<html>
<head>
    <title>Edit Transaction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="card">
        <div class="card-header text-center">
            <h4>Edit Transaction</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Type</label>
                    <select name="type" class="form-select" required>
                        <option value="Income" {% if transaction[1] == 'Income' %}selected{% endif %}>Income</option>
                        <option value="Expense" {% if transaction[1] == 'Expense' %}selected{% endif %}>Expense</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" name="category" value="{{ transaction[2] }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Amount</label>
                    <input type="number" step="0.01" name="amount" value="{{ transaction[3] }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Note</label>
                    <textarea name="note" class="form-control" rows="3">{{ transaction[4] }}</textarea>
                </div>
                <button type="submit" class="btn btn-warning w-100">Update Transaction</button>
                <a href="/" class="btn btn-secondary mt-2 w-100">Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
